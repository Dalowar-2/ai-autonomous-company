server {
    listen 80;
    server_name _;

    # Frontend: serve the built React app as static files
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback — any unknown path serves index.html so React Router
        # (client-side routing) handles it instead of nginx 404ing.
        try_files $uri $uri/ /index.html;
    }

    # Backend: strip the /api prefix and forward to the FastAPI container.
    # e.g. a request to /api/auth/login is proxied to backend:8000/auth/login
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Task execution can take 15-30+ seconds (multiple chained LLM calls) —
        # don't let nginx time out before the backend responds.
        proxy_read_timeout 90s;
    }

    # Basic gzip for the JS/CSS bundle
    gzip on;
    gzip_types text/css application/javascript application/json;
}
